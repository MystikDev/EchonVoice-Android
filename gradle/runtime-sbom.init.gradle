import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

// Resolve the current direct-release dependency graph without building or signing.
// OSV cannot extract dependencies directly from Kotlin Gradle build scripts.
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('writeSecuritySbom') {
        doLast {
            def modules = app.configurations.getByName('directReleaseRuntimeClasspath')
                .incoming.resolutionResult.allComponents.collect { it.id }
                .findAll { it instanceof ModuleComponentIdentifier }
                .sort { "${it.group}:${it.module}:${it.version}" }
            if (modules.isEmpty()) throw new GradleException('No release runtime dependencies resolved')
            def components = modules.collect { id ->
                def encode = { value -> java.net.URLEncoder.encode(value, 'UTF-8').replace('+', '%20') }
                [type: 'library', group: id.group, name: id.module, version: id.version,
                 purl: "pkg:maven/${encode(id.group)}/${encode(id.module)}@${encode(id.version)}"]
            }
            def output = new File(gradle.rootProject.projectDir, 'build/security/runtime.cdx.json')
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                bomFormat: 'CycloneDX', specVersion: '1.5', version: 1, components: components
            ])) + '\n'
            println "Resolved ${components.size()} Maven runtime components to ${output}"
        }
    }
}
