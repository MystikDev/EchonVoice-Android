name: Android validation

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Unit tests, lint, and both release variants
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Check both variants without signing secrets
        run: >-
          ./gradlew :app:testDirectDebugUnitTest :app:testPlayDebugUnitTest
          :app:lintDirectDebug :app:lintPlayDebug
          :app:assembleDirectRelease :app:assemblePlayRelease
          -Pechon.disableFirebase=true

  devices:
    name: Device API ${{ matrix.api }} / ${{ matrix.target }} / ${{ matrix.flavor }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: "24", target: default, flavor: Direct, pages: "4096" }
          - { api: "35", target: google_apis, flavor: Direct, pages: "4096" }
          - { api: "36", target: google_apis, flavor: Direct, pages: "4096" }
          - { api: "36", target: google_apis, flavor: Play, pages: "4096" }
          - { api: "36", target: google_apis_ps16k, flavor: Direct, pages: "16384" }
          - { api: "37.0", target: google_apis, flavor: Direct, pages: "4096" }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation on actual page-size environment
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            if [ '${{ matrix.api }}' != '24' ]; then test "$(adb shell getconf PAGE_SIZE | tr -d '\r')" = "${{ matrix.pages }}"; fi
            ./gradlew :app:connected${{ matrix.flavor }}DebugAndroidTest -Pechon.disableFirebase=true
            ./gradlew :app:assemble${{ matrix.flavor }}Release -Pechon.disableFirebase=true
            flavor=$(echo '${{ matrix.flavor }}' | tr '[:upper:]' '[:lower:]'); "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/echon-startup.apk" "app/build/outputs/apk/$flavor/release/app-$flavor-release-unsigned.apk"
            bash scripts/check-release-startup.sh "$RUNNER_TEMP/echon-startup.apk"
