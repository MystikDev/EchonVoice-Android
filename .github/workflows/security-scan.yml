name: Dependency advisory scan

# OSV dependency/vulnerability scan (security review #2/#3: "add OSV or
# dependency-advisory scanning to CI"). Runs on pushes/PRs to main and weekly.
# Advisory (continue-on-error) so a newly-published transitive CVE surfaces in the
# Actions log without blocking an unrelated release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC

permissions:
  contents: read

jobs:
  osv-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Resolve current release runtime dependencies
        run: ./gradlew -I gradle/runtime-sbom.init.gradle :app:writeSecuritySbom
      - name: Run OSV-Scanner
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@e69cc6c86b31f1e7e23935bbe7031b50e51082de # v2.0.2
        with:
          scan-args: |-
            --sbom=build/security/runtime.cdx.json
